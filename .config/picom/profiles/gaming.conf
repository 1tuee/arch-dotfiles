animations = true;
animation-stiffness = 300;
animation-dampening = 25;
animation-clamping = true;
animation-mass = 1;
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-workspace-switch-in = "fade";
animation-for-workspace-switch-out = "fade";

corner-radius = 0;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.75;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'i3bar'"
];

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 3;

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 0.9;

opacity-rule = [
  "85:class_g = 'Alacritty'",
  "100:class_g = 'firefox'",
  "100:class_g = 'zen-browser'",
  "100:class_g = 'discord'",
  "100:class_g = 'Spotify'",
  "100:class_g = 'steam'",
  "100:class_g = 'mpv'"
];

backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = false;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";

wintypes: {
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; };
  dock = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
