[colors]
background = ${xrdb:color0:#111111}
foreground = ${xrdb:color7:#cccccc}
accent = ${xrdb:color1:#ff0000}
accent2 = ${xrdb:color2:#00ff00}
muted = ${xrdb:color8:#444444}

[bar/bottom]
monitor = ${env:MONITOR:}
width = 100%
height = 52
bottom = true
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = "JetBrainsMono Nerd Font:size=11;2"
font-1 = "JetBrainsMono Nerd Font:size=13;3"
modules-left = spotify
modules-center = battery separator date time separator volume
modules-right = cpu intel-gpu nvidia-gpu memory temperature

[bar/top]
monitor = ${env:MONITOR:}
width = 100%
height = 28
bottom = false
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = "JetBrainsMono Nerd Font:size=12;3"
font-1 = "JetBrainsMono Nerd Font:size=14;4"
modules-left = i3
modules-center =
modules-right = wlan

[module/spotify]
type = custom/script
exec = ~/.config/polybar/scripts/spotify.sh
interval = 2
label = 󰓇 %output%
label-foreground = ${colors.accent}

[module/date]
type = internal/date
interval = 1
date = %a %b %d
label = 󰃭 %date%
label-foreground = ${colors.foreground}

[module/time]
type = internal/date
interval = 1
time = %I:%M %p
label =  %time%
label-foreground = ${colors.foreground}

[module/separator]
type = custom/text
content = |
content-foreground = ${colors.muted}

[module/volume]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}
label-muted = 󰝟 muted
label-muted-foreground = ${colors.muted}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.accent}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%
label-foreground = ${colors.foreground}

[module/intel-gpu]
type = custom/script
exec = ~/.config/polybar/scripts/intel-gpu.sh
interval = 2
label =  %output%
label-foreground = ${colors.foreground}
format-prefix = "󰘚 "
format-prefix-foreground = ${colors.accent}

[module/nvidia-gpu]
type = custom/script
exec = nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits 2>/dev/null | awk '{print $1"%"}'
interval = 2
label =  %output%
label-foreground = ${colors.foreground}
format-prefix = "󰢮 "
format-prefix-foreground = ${colors.accent}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.accent}
label = %percentage_used:2%%
label-foreground = ${colors.foreground}

[module/temperature]
type = internal/temperature
interval = 2
thermal-zone = 0
format-prefix = "󰏈 "
format-prefix-foreground = ${colors.accent}
label = %temperature-c%
label-foreground = ${colors.foreground}
label-warn = %temperature-c%
label-warn-foreground = ${colors.accent}
warn-temperature = 80

[module/i3]
type = internal/i3
format = <label-state>
index-sort = true
wrapping-scroll = false
label-focused = %index%
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.background}
label-focused-padding = 3
label-unfocused = %index%
label-unfocused-padding = 3
label-unfocused-foreground = ${colors.muted}
label-visible = %index%
label-visible-padding = 3
label-urgent = %index%!
label-urgent-background = ${colors.accent}
label-urgent-padding = 3

[module/wlan]
type = internal/network
interface = wlan0
interval = 3.0
format-connected-prefix = "󰖨 "
format-connected-prefix-foreground = ${colors.accent}
label-connected = %essid% %signal%%
label-connected-foreground = ${colors.foreground}
format-disconnected-prefix = "󰖪 "
format-disconnected-prefix-foreground = ${colors.accent}
label-disconnected = Disconnected
label-disconnected-foreground = ${colors.muted}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
format-charging-prefix = "󰂄 "
format-charging-prefix-foreground = ${colors.accent}
label-charging = %percentage%%
format-discharging-prefix = "󰁹 "
format-discharging-prefix-foreground = ${colors.accent}
label-discharging = %percentage%%
format-full-prefix = "󰁹 "
format-full-prefix-foreground = ${colors.accent}
label-full = Full

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0
